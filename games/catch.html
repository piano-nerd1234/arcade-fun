<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catch the Wrong Thing</title>
    <style>
        body { margin: 0; background-color: #111; color: #fff; font-family: 'Permanent Marker', cursive, sans-serif; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; flex-direction: column; }
        
        /* Menus */
        .menu-container { text-align: center; background: rgba(20, 20, 40, 0.95); padding: 40px; border: 6px solid #ff007f; border-radius: 20px; box-shadow: 0 0 30px #ff007f; z-index: 10; max-width: 600px; }
        h1 { font-size: 45px; color: #00ffff; text-shadow: 4px 4px 0px #ff007f; margin-top: 0; letter-spacing: 2px; }
        h2 { font-size: 32px; color: #ffd700; text-shadow: 3px 3px 0px #ff0000; }
        
        /* Retro Buttons */
        button { background: #00ffff; color: #000; border: 4px solid #fff; padding: 15px 30px; font-size: 22px; font-weight: bold; cursor: pointer; font-family: 'Permanent Marker', cursive; margin: 10px; box-shadow: 6px 6px 0px #ff007f; transition: 0.1s; text-transform: uppercase; border-radius: 10px; }
        button:active { transform: translate(6px, 6px); box-shadow: 0px 0px 0px #ff007f; }
        button:disabled { background: #333; color: #666; border-color: #222; box-shadow: none; cursor: not-allowed; }

        /* Level Grid */
        .level-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px; margin-top: 20px; }
        .level-btn { padding: 10px; font-size: 26px; }

        /* Top Bar & Progress */
        .top-bar { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; align-items: center; z-index: 20; }
        .progress-container { flex-grow: 1; background: #000; border: 4px solid #fff; border-radius: 10px; height: 30px; margin: 0 20px; position: relative; overflow: hidden; display: none; box-shadow: 0 0 15px #00ff00; }
        #progressBar { height: 100%; background: linear-gradient(90deg, #00ff00, #ffff00); width: 0%; transition: width 0.1s linear; }
        .time-text { position: absolute; top: 3px; left: 50%; transform: translateX(-50%); font-size: 18px; font-weight: bold; text-shadow: 2px 2px 0px #000; color: #fff; font-family: sans-serif; }

        /* Sharp edges for the canvas */
        #gameCanvas { background: linear-gradient(to bottom, #ff7e5f, #feb47b); border: 8px solid #fff; border-radius: 15px; display: none; box-shadow: 0 10px 40px rgba(0,0,0,0.8); cursor: none; image-rendering: pixelated; }
        .hidden { display: none !important; }
        
        /* Briefing Screen */
        .briefing-box { display: flex; justify-content: space-around; background: #111; padding: 20px; border: 4px dashed #00ffff; border-radius: 15px; margin: 20px 0; }
        .briefing-col { display: flex; flex-direction: column; align-items: center; }
        .emoji-list { font-size: 45px; margin-top: 10px; image-rendering: pixelated; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
</head>
<body>

    <div class="top-bar">
        <button onclick="window.location.href='../index.html'" style="padding: 5px 15px; font-size: 16px;">🔙 Hub</button>
        <div class="progress-container" id="progressContainer">
            <div id="progressBar"></div>
            <div class="time-text">TIME SURVIVED</div>
        </div>
        <div style="font-size: 28px; text-shadow: 3px 3px 0 #000; display: none; color: #00ffff;" id="scoreDisplay">Score: 0</div>
    </div>

    <!-- LEVEL SELECT MENU -->
    <div id="mainMenu" class="menu-container">
        <h1>Neon Catch</h1>
        <p style="color: #00ff00; font-size: 20px;">✅ You MUST catch every target item!</p>
        <p style="color: #ff3333; font-size: 20px;">❌ Catching a wrong item OR dropping a target = GAME OVER</p>
        <div class="level-grid" id="levelGrid"></div>
    </div>

    <!-- TUTORIAL / BRIEFING SCREEN -->
    <div id="briefingMenu" class="menu-container hidden">
        <h2 id="briefingTitle">Level 1</h2>
        <div class="briefing-box">
            <div class="briefing-col">
                <h3 style="color: #00ff00; margin: 0; text-shadow: 2px 2px 0 #000;">✅ CATCH ALL ✅</h3>
                <div class="emoji-list" id="catchList">🐸</div>
            </div>
            <div class="briefing-col">
                <h3 style="color: #ff0000; margin: 0; text-shadow: 2px 2px 0 #000;">❌ AVOID ❌</h3>
                <div class="emoji-list" id="avoidList">🦎</div>
            </div>
        </div>
        <button onclick="startLevel()" style="background: #00ff00;">START GAME</button>
        <button onclick="returnToMenu()" style="background: #ff0000; color: #fff;">CANCEL</button>
    </div>

    <!-- GAME CANVAS -->
    <canvas id="gameCanvas" width="600" height="700"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false; 

        const mainMenu = document.getElementById('mainMenu');
        const briefingMenu = document.getElementById('briefingMenu');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const levelGrid = document.getElementById('levelGrid');

        let unlockedLevel = parseInt(localStorage.getItem('catch_unlocked')) || 1;
        let totalScore = parseInt(localStorage.getItem('catch_score')) || 0;
        const MAX_LEVELS = 10;

        let isPlaying = false;
        let currentLevel = 1;
        let score = 0;
        let frame = 0;
        let timeRemaining = 0;
        let levelDuration = 0;
        let backgroundOffset = 0;
        
        let bucket = { x: 260, y: 580, width: 80, height: 80 };
        let fallingItems = [];
        let scorePopups = []; // Fancy visual effect for points!

        const levelData = {
            1: { time: 20, speed: 4, spawnRate: 50, catch: ['🐸'], avoid: ['🦎'] },
            2: { time: 25, speed: 4.5, spawnRate: 45, catch: ['🐸'], avoid: ['🦎', '🐍'] },
            3: { time: 25, speed: 5, spawnRate: 45, catch: ['🐸', '🦋'], avoid: ['🦎', '🐍'] },
            4: { time: 30, speed: 5.5, spawnRate: 40, catch: ['🐸', '🦋'], avoid: ['🦎', '🐍', '🕷️'] },
            5: { time: 35, speed: 6, spawnRate: 35, catch: ['🐸', '🦋', '🐞'], avoid: ['🦎', '🐍', '🕷️'] },
            6: { time: 35, speed: 6.5, spawnRate: 35, catch: ['🐸', '🐞'], avoid: ['🦎', '🐍', '🕷️', '🦂'] },
            7: { time: 40, speed: 7, spawnRate: 30, catch: ['🦋', '🐞', '🐢'], avoid: ['🦎', '🐍', '🦂', '🦇'] },
            8: { time: 45, speed: 7.5, spawnRate: 25, catch: ['🐸', '🐢', '🐦'], avoid: ['🦎', '🐍', '🕷️', '🦇'] },
            9: { time: 50, speed: 8, spawnRate: 20, catch: ['🐞', '🐦', '🦋'], avoid: ['🦎', '🐍', '🦂', '🦇', '🐊'] },
            10: { time: 60, speed: 9, spawnRate: 18, catch: ['🐸', '🦋', '🐞', '🐢', '🐦'], avoid: ['🦎', '🐍', '🕷️', '🦂', '🦇', '🐊'] }
        };

        let currentActiveList = [];
        let currentAvoidList = [];

        // FIXED PIXELATOR: Increased to 32x32 so emojis never get chopped off on the edges!
        const pixelCache = {};
        function getPixelatedImage(emoji) {
            if (pixelCache[emoji]) return pixelCache[emoji];
            let offscreen = document.createElement('canvas');
            offscreen.width = 32; offscreen.height = 32;
            let oCtx = offscreen.getContext('2d');
            oCtx.font = '24px Arial';
            oCtx.textAlign = 'center';
            oCtx.textBaseline = 'middle';
            oCtx.fillText(emoji, 16, 18);
            pixelCache[emoji] = offscreen;
            return offscreen;
        }

        function buildMenu() {
            levelGrid.innerHTML = '';
            for (let i = 1; i <= MAX_LEVELS; i++) {
                let btn = document.createElement('button');
                btn.className = 'level-btn';
                if (i <= unlockedLevel) {
                    btn.innerText = i;
                    btn.onclick = () => showBriefing(i);
                } else {
                    btn.innerText = '🔒';
                    btn.disabled = true;
                }
                levelGrid.appendChild(btn);
            }
        }
        buildMenu();

        function showBriefing(level) {
            currentLevel = level;
            const data = levelData[level];
            document.getElementById('briefingTitle').innerText = `Level ${level}`;
            document.getElementById('catchList').innerText = data.catch.join(' ');
            document.getElementById('avoidList').innerText = data.avoid.join(' ');
            mainMenu.classList.add('hidden');
            briefingMenu.classList.remove('hidden');
        }

        function returnToMenu() {
            isPlaying = false;
            briefingMenu.classList.add('hidden');
            canvas.style.display = 'none';
            progressContainer.style.display = 'none';
            scoreDisplay.style.display = 'none';
            mainMenu.classList.remove('hidden');
            buildMenu();
        }

        let keys = { a: false, d: false, ArrowLeft: false, ArrowRight: false };
        window.addEventListener('keydown', e => { if(keys.hasOwnProperty(e.key)) keys[e.key] = true; });
        window.addEventListener('keyup', e => { if(keys.hasOwnProperty(e.key)) keys[e.key] = false; });
        
        canvas.addEventListener('mousemove', (e) => {
            if (!isPlaying) return;
            let rect = canvas.getBoundingClientRect();
            bucket.x = (e.clientX - rect.left) - bucket.width / 2;
        });

        function startLevel() {
            const data = levelData[currentLevel];
            currentActiveList = data.catch;
            currentAvoidList = data.avoid;
            levelDuration = data.time * 60; 
            timeRemaining = levelDuration;
            
            briefingMenu.classList.add('hidden');
            canvas.style.display = 'block';
            progressContainer.style.display = 'block';
            scoreDisplay.style.display = 'block';
            
            bucket.x = 260;
            fallingItems = [];
            scorePopups = [];
            score = 0;
            scoreDisplay.innerText = `Score: ${score}`;
            frame = 0;
            
            isPlaying = true;
        }

        function levelComplete() {
            isPlaying = false;
            totalScore += score;
            localStorage.setItem('catch_score', totalScore);
            
            if (currentLevel === unlockedLevel && unlockedLevel < MAX_LEVELS) {
                unlockedLevel++;
                localStorage.setItem('catch_unlocked', unlockedLevel);
            }
            
            alert(`TIME'S UP! You survived Level ${currentLevel}!\nScore earned: ${score}`);
            returnToMenu();
        }

        function gameOver(type, emoji) {
            isPlaying = false; // Instantly stops the game engine
            fallingItems = []; // Clears screen
            
            if (type === 'caughtBad') {
                alert(`GAME OVER! You caught a ${emoji}!\nPay attention to the Avoid list!`);
            } else if (type === 'missedGood') {
                alert(`GAME OVER! You let a ${emoji} hit the floor!\nYou MUST catch every target item!`);
            }
            showBriefing(currentLevel); 
            canvas.style.display = 'none';
            progressContainer.style.display = 'none';
            scoreDisplay.style.display = 'none';
        }

        function spawnItem() {
            const data = levelData[currentLevel];
            if (frame % data.spawnRate === 0) {
                let isGood = Math.random() > 0.5;
                let pool = isGood ? currentActiveList : currentAvoidList;
                let emoji = pool[Math.floor(Math.random() * pool.length)];
                
                fallingItems.push({
                    x: Math.random() * (canvas.width - 60) + 30, // Keeps them safely on screen
                    y: -50,
                    emoji: emoji,
                    isGood: isGood,
                    speed: data.speed + (Math.random() * 1.5) 
                });
            }
        }

        function update() {
            // Bucket Keyboard Movement
            if ((keys.a || keys.ArrowLeft) && bucket.x > 0) bucket.x -= 10;
            if ((keys.d || keys.ArrowRight) && bucket.x < canvas.width - bucket.width) bucket.x += 10;

            // Keep bucket in bounds
            if (bucket.x < 0) bucket.x = 0;
            if (bucket.x + bucket.width > canvas.width) bucket.x = canvas.width - bucket.width;

            // Time & Progress
            timeRemaining--;
            let progressPercent = ((levelDuration - timeRemaining) / levelDuration) * 100;
            progressBar.style.width = `${progressPercent}%`;

            if (timeRemaining <= 0) {
                levelComplete();
                return;
            }

            backgroundOffset += 1; // Creates the moving floor illusion

            // Move Items
            for (let i = 0; i < fallingItems.length; i++) {
                let item = fallingItems[i];
                item.y += item.speed;

                // PERFECTED HITBOX: Specifically covers the silver bucket opening
                let bucketHitX = bucket.x + 30; 
                let bucketHitY = bucket.y + 10;
                let bucketHitW = 60;
                let bucketHitH = 30;

                // Collision Detection
                if (item.y + 20 > bucketHitY && item.y - 20 < bucketHitY + bucketHitH &&
                    item.x + 20 > bucketHitX && item.x - 20 < bucketHitX + bucketHitW) {
                    
                    if (item.isGood) {
                        score += 10;
                        scoreDisplay.innerText = `Score: ${score}`;
                        item.caught = true; 
                        
                        // Add floating text effect!
                        scorePopups.push({ x: item.x, y: bucketHitY, alpha: 1.0 });
                    } else {
                        gameOver('caughtBad', item.emoji);
                        return; // Stop updating immediately
                    }
                }

                // Hit the floor check
                if (item.y > canvas.height + 20 && !item.caught) {
                    if (item.isGood) {
                        gameOver('missedGood', item.emoji);
                        return; // Stop updating immediately
                    } else {
                        item.caught = true; 
                    }
                }
            }

            // Clean up items and animate popups
            fallingItems = fallingItems.filter(item => !item.caught);
            
            for (let popup of scorePopups) {
                popup.y -= 2;
                popup.alpha -= 0.02;
            }
            scorePopups = scorePopups.filter(p => p.alpha > 0);
        }

        function draw() {
            // Vibrant Sky Gradient
            let gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, "#4facfe");
            gradient.addColorStop(1, "#00f2fe");
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Colorful Checkerboard Ground (Retro style)
            let groundY = canvas.height - 50;
            for (let i = 0; i < canvas.width + 100; i += 40) {
                ctx.fillStyle = (Math.floor((i - backgroundOffset) / 40) % 2 === 0) ? '#32cd32' : '#228b22';
                ctx.fillRect(i - (backgroundOffset % 80), groundY, 40, 50);
            }
            ctx.fillStyle = '#fff';
            ctx.fillRect(0, groundY, canvas.width, 4); // White line separating sky and ground

            // DRAW 8-BIT NEON GUY
            let bx = bucket.x;
            let by = bucket.y;
            
            // Guy - Head (Skin tone)
            ctx.fillStyle = '#ffcc99';
            ctx.fillRect(bx + 10, by, 30, 30);
            
            // Guy - Cyber Visor (Glowing pink)
            ctx.fillStyle = '#ff007f';
            ctx.fillRect(bx + 20, by + 5, 20, 10);
            ctx.fillStyle = '#fff';
            ctx.fillRect(bx + 35, by + 5, 5, 5); // Visor shine
            
            // Guy - Shirt (Neon Yellow)
            ctx.fillStyle = '#ffff00';
            ctx.fillRect(bx + 5, by + 30, 40, 40);
            
            // Guy - Pants (Dark Blue)
            ctx.fillStyle = '#00008b';
            ctx.fillRect(bx + 10, by + 70, 30, 20);
            
            // Big Silver Bucket
            ctx.fillStyle = '#d3d3d3'; // Light Silver
            ctx.fillRect(bx + 35, by + 20, 55, 45);
            ctx.fillStyle = '#a9a9a9'; // Dark Silver Rim
            ctx.fillRect(bx + 30, by + 15, 65, 10);
            ctx.fillStyle = '#000'; // Inside bucket void
            ctx.fillRect(bx + 35, by + 20, 55, 10);

            // Draw Pixelated Items
            ctx.imageSmoothingEnabled = false; 
            for (let item of fallingItems) {
                let img = getPixelatedImage(item.emoji);
                // Draw 32x32 upscaled to 54x54
                ctx.drawImage(img, 0, 0, 32, 32, item.x - 27, item.y - 27, 54, 54);
            }

            // Draw Floating Score Popups
            ctx.font = '24px "Permanent Marker"';
            ctx.textAlign = 'center';
            for (let popup of scorePopups) {
                ctx.fillStyle = `rgba(0, 255, 0, ${popup.alpha})`;
                ctx.fillText('+10', popup.x, popup.y);
            }
        }

        // --- THE MASTER LOOP ---
        function masterLoop() {
            requestAnimationFrame(masterLoop);
            if (!isPlaying) return;
            frame++;
            spawnItem();
            update();
            draw();
        }

        masterLoop(); 
    </script>
</body>
</html>
