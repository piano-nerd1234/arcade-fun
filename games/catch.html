<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catch the Wrong Thing</title>
    <style>
        body { margin: 0; background-color: #87CEEB; color: #fff; font-family: 'Permanent Marker', cursive, sans-serif; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; flex-direction: column; }
        
        /* Menus */
        .menu-container { text-align: center; background: rgba(34, 139, 34, 0.9); padding: 40px; border: 4px solid #006400; border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.5); z-index: 10; max-width: 600px; }
        h1 { font-size: 40px; color: #FFD700; text-shadow: 2px 2px 0 #000; margin-top: 0; }
        h2 { font-size: 28px; text-shadow: 2px 2px 0 #000; }
        
        /* Buttons */
        button { background: #FFD700; color: #000; border: 2px solid #000; padding: 15px 30px; font-size: 20px; font-weight: bold; cursor: pointer; border-radius: 8px; font-family: 'Permanent Marker', cursive; margin: 10px; transition: 0.2s; box-shadow: 3px 3px 0 #000; }
        button:hover { transform: translateY(-3px); box-shadow: 6px 6px 0 #000; }
        button:disabled { background: #555; color: #888; box-shadow: none; cursor: not-allowed; transform: none; }

        /* Level Grid */
        .level-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 20px; }
        .level-btn { padding: 10px; font-size: 24px; }

        /* Top Bar & Progress */
        .top-bar { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; align-items: center; z-index: 20; }
        .progress-container { flex-grow: 1; background: rgba(0,0,0,0.5); border: 2px solid #fff; border-radius: 10px; height: 25px; margin: 0 20px; position: relative; overflow: hidden; display: none; }
        #progressBar { height: 100%; background: #FFD700; width: 0%; transition: width 0.1s linear; }
        .time-text { position: absolute; top: 2px; left: 50%; transform: translateX(-50%); font-size: 16px; font-family: sans-serif; font-weight: bold; text-shadow: 1px 1px 2px #000; }

        #gameCanvas { background: linear-gradient(#87CEEB, #90EE90); border: 4px solid #006400; border-radius: 10px; display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.3); cursor: none; }
        .hidden { display: none !important; }
        
        /* Briefing Screen */
        .briefing-box { display: flex; justify-content: space-around; background: rgba(0,0,0,0.3); padding: 15px; border-radius: 10px; margin: 15px 0; }
        .briefing-col { display: flex; flex-direction: column; align-items: center; }
        .emoji-list { font-size: 40px; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
</head>
<body>

    <div class="top-bar">
        <button onclick="window.location.href='../index.html'" style="padding: 5px 10px; font-size: 14px;">🔙 Hub</button>
        <div class="progress-container" id="progressContainer">
            <div id="progressBar"></div>
            <div class="time-text">TIME SURVIVED</div>
        </div>
        <div style="font-size: 24px; text-shadow: 2px 2px 0 #000; display: none;" id="scoreDisplay">Score: 0</div>
    </div>

    <!-- LEVEL SELECT MENU -->
    <div id="mainMenu" class="menu-container">
        <h1>Catch the Wrong Thing</h1>
        <p>Memorize what to catch and what to avoid.</p>
        <p>Use <strong>A/D</strong>, <strong>Left/Right Arrows</strong>, or <strong>Mouse</strong> to move your bucket.</p>
        <div class="level-grid" id="levelGrid"></div>
    </div>

    <!-- TUTORIAL / BRIEFING SCREEN -->
    <div id="briefingMenu" class="menu-container hidden">
        <h2 id="briefingTitle">Level 1</h2>
        <p>Memorize your targets before time runs out!</p>
        <div class="briefing-box">
            <div class="briefing-col">
                <h3 style="color: #00FF00; margin: 0;">✅ CATCH ✅</h3>
                <div class="emoji-list" id="catchList">🐸</div>
            </div>
            <div class="briefing-col">
                <h3 style="color: #FF0000; margin: 0;">❌ AVOID ❌</h3>
                <div class="emoji-list" id="avoidList">🦎</div>
            </div>
        </div>
        <button onclick="startLevel()">START GAME</button>
        <button onclick="returnToMenu()">CANCEL</button>
    </div>

    <!-- GAME CANVAS -->
    <canvas id="gameCanvas" width="600" height="700"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const mainMenu = document.getElementById('mainMenu');
        const briefingMenu = document.getElementById('briefingMenu');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const levelGrid = document.getElementById('levelGrid');

        let unlockedLevel = parseInt(localStorage.getItem('catch_unlocked')) || 1;
        let totalScore = parseInt(localStorage.getItem('catch_score')) || 0;
        const MAX_LEVELS = 10;

        let isPlaying = false;
        let currentLevel = 1;
        let score = 0;
        let frame = 0;
        let timeRemaining = 0;
        let levelDuration = 0;
        
        let bucket = { x: 260, y: 620, width: 80, height: 60 };
        let fallingItems = [];

        // LEVEL DATA (Defines what drops and how hard it is)
        const levelData = {
            1: { time: 20, speed: 3, spawnRate: 60, catch: ['🐸'], avoid: ['🦎'] },
            2: { time: 25, speed: 4, spawnRate: 55, catch: ['🐸'], avoid: ['🦎', '🐍'] },
            3: { time: 25, speed: 4, spawnRate: 50, catch: ['🐸', '🦋'], avoid: ['🦎', '🐍'] },
            4: { time: 30, speed: 5, spawnRate: 45, catch: ['🐸', '🦋'], avoid: ['🦎', '🐍', '🕷️'] },
            5: { time: 35, speed: 5, spawnRate: 40, catch: ['🐸', '🦋', '🐞'], avoid: ['🦎', '🐍', '🕷️'] },
            6: { time: 35, speed: 6, spawnRate: 35, catch: ['🐸', '🐞'], avoid: ['🦎', '🐍', '🕷️', '🦂'] },
            7: { time: 40, speed: 6, spawnRate: 30, catch: ['🦋', '🐞', '🐢'], avoid: ['🦎', '🐍', '🦂', '🦇'] },
            8: { time: 45, speed: 7, spawnRate: 25, catch: ['🐸', '🐢', '🐦'], avoid: ['🦎', '🐍', '🕷️', '🦇'] },
            9: { time: 50, speed: 8, spawnRate: 20, catch: ['🐞', '🐦', '🦋'], avoid: ['🦎', '🐍', '🦂', '🦇', '🐊'] },
            10: { time: 60, speed: 9, spawnRate: 15, catch: ['🐸', '🦋', '🐞', '🐢', '🐦'], avoid: ['🦎', '🐍', '🕷️', '🦂', '🦇', '🐊'] }
        };

        let currentActiveList = [];
        let currentAvoidList = [];

        // MENU SYSTEM
        function buildMenu() {
            levelGrid.innerHTML = '';
            for (let i = 1; i <= MAX_LEVELS; i++) {
                let btn = document.createElement('button');
                btn.className = 'level-btn';
                if (i <= unlockedLevel) {
                    btn.innerText = i;
                    btn.onclick = () => showBriefing(i);
                } else {
                    btn.innerText = '🔒';
                    btn.disabled = true;
                }
                levelGrid.appendChild(btn);
            }
        }
        buildMenu();

        function showBriefing(level) {
            currentLevel = level;
            const data = levelData[level];
            
            document.getElementById('briefingTitle').innerText = `Level ${level}`;
            document.getElementById('catchList').innerText = data.catch.join(' ');
            document.getElementById('avoidList').innerText = data.avoid.join(' ');
            
            mainMenu.classList.add('hidden');
            briefingMenu.classList.remove('hidden');
        }

        function returnToMenu() {
            isPlaying = false;
            briefingMenu.classList.add('hidden');
            canvas.style.display = 'none';
            progressContainer.style.display = 'none';
            scoreDisplay.style.display = 'none';
            mainMenu.classList.remove('hidden');
            buildMenu();
        }

        // CONTROLS (Keyboard & Mouse)
        let keys = { a: false, d: false, ArrowLeft: false, ArrowRight: false };
        window.addEventListener('keydown', e => { if(keys.hasOwnProperty(e.key)) keys[e.key] = true; });
        window.addEventListener('keyup', e => { if(keys.hasOwnProperty(e.key)) keys[e.key] = false; });
        
        canvas.addEventListener('mousemove', (e) => {
            let rect = canvas.getBoundingClientRect();
            bucket.x = (e.clientX - rect.left) - bucket.width / 2;
        });

        // GAME LOGIC
        function startLevel() {
            const data = levelData[currentLevel];
            currentActiveList = data.catch;
            currentAvoidList = data.avoid;
            levelDuration = data.time * 60; // Convert seconds to frames (assuming 60fps)
            timeRemaining = levelDuration;
            
            briefingMenu.classList.add('hidden');
            canvas.style.display = 'block';
            progressContainer.style.display = 'block';
            scoreDisplay.style.display = 'block';
            
            bucket.x = 260;
            fallingItems = [];
            score = 0;
            scoreDisplay.innerText = `Score: ${score}`;
            frame = 0;
            
            isPlaying = true;
        }

        function levelComplete() {
            isPlaying = false;
            totalScore += score;
            localStorage.setItem('catch_score', totalScore);
            
            if (currentLevel === unlockedLevel && unlockedLevel < MAX_LEVELS) {
                unlockedLevel++;
                localStorage.setItem('catch_unlocked', unlockedLevel);
            }
            
            alert(`TIME'S UP! You survived Level ${currentLevel}!\nScore earned: ${score}`);
            returnToMenu();
        }

        function gameOver(badEmoji) {
            isPlaying = false;
            alert(`GAME OVER! You caught a ${badEmoji}!\nPay attention to the Avoid list!`);
            showBriefing(currentLevel); // Send back to briefing screen for immediate retry
            canvas.style.display = 'none';
            progressContainer.style.display = 'none';
            scoreDisplay.style.display = 'none';
        }

        function spawnItem() {
            const data = levelData[currentLevel];
            if (frame % data.spawnRate === 0) {
                // 50% chance for a good item, 50% chance for a bad item
                let isGood = Math.random() > 0.5;
                let pool = isGood ? currentActiveList : currentAvoidList;
                let emoji = pool[Math.floor(Math.random() * pool.length)];
                
                fallingItems.push({
                    x: Math.random() * (canvas.width - 40) + 20,
                    y: -30,
                    emoji: emoji,
                    isGood: isGood,
                    speed: data.speed + (Math.random() * 2) // Slight random speed variation
                });
            }
        }

        function update() {
            // Bucket Keyboard Movement
            if ((keys.a || keys.ArrowLeft) && bucket.x > 0) bucket.x -= 8;
            if ((keys.d || keys.ArrowRight) && bucket.x < canvas.width - bucket.width) bucket.x += 8;

            // Keep bucket in bounds for mouse
            if (bucket.x < 0) bucket.x = 0;
            if (bucket.x + bucket.width > canvas.width) bucket.x = canvas.width - bucket.width;

            // Time & Progress
            timeRemaining--;
            let progressPercent = ((levelDuration - timeRemaining) / levelDuration) * 100;
            progressBar.style.width = `${progressPercent}%`;

            if (timeRemaining <= 0) {
                levelComplete();
                return;
            }

            // Move Items
            for (let i = 0; i < fallingItems.length; i++) {
                let item = fallingItems[i];
                item.y += item.speed;

                // Collision with Bucket
                if (item.y + 15 > bucket.y && item.y - 15 < bucket.y + bucket.height &&
                    item.x + 15 > bucket.x && item.x - 15 < bucket.x + bucket.width) {
                    
                    if (item.isGood) {
                        score += 10;
                        scoreDisplay.innerText = `Score: ${score}`;
                        item.caught = true; // Mark to remove
                    } else {
                        gameOver(item.emoji);
                        return;
                    }
                }
            }

            // Clean up off-screen or caught items
            fallingItems = fallingItems.filter(item => item.y < canvas.height + 50 && !item.caught);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Bucket Body
            ctx.fillStyle = '#8B4513'; // SaddleBrown
            ctx.beginPath();
            ctx.moveTo(bucket.x, bucket.y);
            ctx.lineTo(bucket.x + bucket.width, bucket.y);
            ctx.lineTo(bucket.x + bucket.width - 10, bucket.y + bucket.height);
            ctx.lineTo(bucket.x + 10, bucket.y + bucket.height);
            ctx.fill();
            
            // Draw Bucket Rim
            ctx.fillStyle = '#A0522D'; // Sienna
            ctx.fillRect(bucket.x - 5, bucket.y, bucket.width + 10, 10);

            // Draw Items
            ctx.font = '30px Arial'; // Arial renders emojis best on canvas
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            for (let item of fallingItems) {
                ctx.fillText(item.emoji, item.x, item.y);
            }
        }

        // --- THE MASTER LOOP ---
        function masterLoop() {
            requestAnimationFrame(masterLoop);
            if (!isPlaying) return;
            frame++;
            spawnItem();
            update();
            draw();
        }

        masterLoop(); // Start engine!
    </script>
</body>
</html>
