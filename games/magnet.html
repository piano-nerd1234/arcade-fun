<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magnet Mayhem</title>
    <style>
        body { margin: 0; background-color: #0d1b2a; color: #00ffcc; font-family: 'Orbitron', sans-serif; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        /* Level Select Menu Styles */
        #menu { text-align: center; background: rgba(13, 27, 42, 0.95); padding: 40px; border: 2px solid #00ffcc; border-radius: 10px; box-shadow: 0 0 20px #00ffcc; z-index: 10; max-width: 600px; }
        .level-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px; margin-top: 20px; }
        .level-btn { background: #1b263b; border: 2px solid #00ffcc; color: #00ffcc; font-size: 20px; padding: 15px; border-radius: 8px; cursor: pointer; font-family: 'Orbitron', sans-serif; }
        .level-btn:hover:not(.locked) { background: #00ffcc; color: #000; }
        .level-btn.locked { opacity: 0.4; cursor: not-allowed; border-color: #555; color: #555; }
        
        /* Game Screen Styles */
        #gameUI { display: none; display: flex; gap: 20px; }
        #gameCanvas { background: #1b263b; border: 2px solid #00ffcc; border-radius: 10px; }
        
        /* Side Magnet Panel */
        #sidePanel { background: #1b263b; border: 2px solid #00ffcc; border-radius: 10px; width: 120px; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; box-shadow: 0 0 15px #00ffcc; }
        #magnetEmoji { font-size: 60px; transform: rotate(-90deg); margin-bottom: 20px; }
        #arrows { font-size: 30px; font-weight: bold; color: #fff; height: 40px; text-shadow: 0 0 10px #00ffcc; }

        /* Top Bar */
        .top-bar { position: absolute; top: 10px; left: 20px; z-index: 20; }
        button.ui-btn { background: #00ffcc; color: #000; border: none; padding: 10px 20px; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 5px; font-family: 'Orbitron', sans-serif; margin-right: 10px;}
        button.ui-btn:hover { background: #00ccaa; }

        .hidden { display: none !important; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;900&display=swap" rel="stylesheet">
</head>
<body>

    <!-- LEVEL SELECT MENU -->
    <div id="menu">
        <button class="ui-btn" style="float: left;" onclick="window.location.href='../index.html'">🔙 Hub</button>
        <h1 style="font-size: 36px; margin-top: 0;">🧲 Magnet Mayhem</h1>
        <p>Select a level. Dodge the lasers.</p>
        <div class="level-grid" id="levelGrid">
            <!-- Buttons are generated by JavaScript here -->
        </div>
    </div>

    <!-- ACTUAL GAME -->
    <div id="gameUI" class="hidden">
        <div class="top-bar">
            <button class="ui-btn" onclick="returnToMenu()">🔙 Levels</button>
            <span style="font-size: 24px;">Level: <span id="displayLevel">1</span></span>
        </div>
        
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        
        <div id="sidePanel">
            <div id="magnetEmoji">🧲</div>
            <div id="arrows"></div> <!-- Arrows show up here -->
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const menu = document.getElementById('menu');
        const gameUI = document.getElementById('gameUI');
        const levelGrid = document.getElementById('levelGrid');
        const arrowDisplay = document.getElementById('arrows');
        const displayLevel = document.getElementById('displayLevel');

        let unlockedLevel = localStorage.getItem('magnet_unlocked') || 1;
        unlockedLevel = parseInt(unlockedLevel);
        const MAX_LEVEL = 20;

        let gameLoop;
        let isPlaying = false;
        let currentLevel = 1;
        let frame = 0;
        
        let ball = { x: 200, y: 500, radius: 10, color: '#b0c4de' }; // Metal ball
        let obstacles = [];
        let state = 'neutral'; 
        let obstaclesToPass = 15;
        let obstaclesPassed = 0;

        // --- MENU SYSTEM ---
        function buildMenu() {
            levelGrid.innerHTML = '';
            for (let i = 1; i <= MAX_LEVEL; i++) {
                let btn = document.createElement('button');
                btn.classList.add('level-btn');
                if (i <= unlockedLevel) {
                    btn.innerText = i;
                    btn.onclick = () => startLevel(i);
                } else {
                    btn.innerText = '🔒';
                    btn.classList.add('locked');
                }
                levelGrid.appendChild(btn);
            }
        }

        function returnToMenu() {
            isPlaying = false;
            gameUI.classList.add('hidden');
            menu.classList.remove('hidden');
            buildMenu();
        }

        // --- CONTROLS ---
        window.addEventListener('keydown', (e) => {
            if (['w', 'd', 'ArrowUp', 'ArrowRight'].includes(e.key)) {
                state = 'right';
                arrowDisplay.innerText = '>>>';
            }
            if (['a', 's', 'ArrowDown', 'ArrowLeft'].includes(e.key)) {
                state = 'left';
                arrowDisplay.innerText = '<<<';
            }
        });
        window.addEventListener('keyup', () => { 
            state = 'neutral'; 
            arrowDisplay.innerText = '';
        });

        // --- GAME LOGIC ---
        function startLevel(level) {
            currentLevel = level;
            displayLevel.innerText = level;
            menu.classList.add('hidden');
            gameUI.classList.remove('hidden');
            
            // Reset game variables
            ball.x = 200;
            obstacles = [];
            frame = 0;
            obstaclesPassed = 0;
            isPlaying = true;
            
            loop();
        }

        function levelComplete() {
            isPlaying = false;
            if (currentLevel === unlockedLevel && unlockedLevel < MAX_LEVEL) {
                unlockedLevel++;
                localStorage.setItem('magnet_unlocked', unlockedLevel);
            }
            alert(`SYSTEM CLEAR! Level ${currentLevel} Complete!`);
            returnToMenu();
        }

        function gameOver() {
            isPlaying = false;
            alert("SYSTEM FAILURE. You hit a laser! Restarting Level...");
            startLevel(currentLevel); // Instant restart
        }

        function spawnObstacle() {
            // Gap gets tighter as level increases. Level 1 = 180px gap, Level 20 = 60px gap.
            let gapSize = 180 - ((currentLevel - 1) * 6); 
            if (gapSize < 50) gapSize = 50; 

            if (frame % 80 === 0 && obstaclesPassed + obstacles.length < obstaclesToPass) { 
                let gapX = Math.random() * (400 - gapSize); // Random position for the safe gap
                obstacles.push({ y: -20, gapX: gapX, gapWidth: gapSize, height: 15 });
            }
        }

        function update() {
            // Move Ball
            if (state === 'right' && ball.x < 390) ball.x += 5;
            if (state === 'left' && ball.x > 10) ball.x -= 5;

            // Move Lasers
            for (let i = 0; i < obstacles.length; i++) {
                obstacles[i].y += 4 + (currentLevel * 0.15); // Lasers get slightly faster each level
                
                // Collision Detection
                if (ball.y - ball.radius < obstacles[i].y + obstacles[i].height &&
                    ball.y + ball.radius > obstacles[i].y) {
                    
                    // If ball is OUTSIDE the safe gap, it hits the laser
                    if (ball.x - ball.radius < obstacles[i].gapX || ball.x + ball.radius > obstacles[i].gapX + obstacles[i].gapWidth) {
                        gameOver();
                        return;
                    }
                }

                // Count Passed Lasers
                if (obstacles[i].y > 600 && !obstacles[i].passed) {
                    obstacles[i].passed = true;
                    obstaclesPassed++;
                    if (obstaclesPassed >= obstaclesToPass) {
                        levelComplete();
                        return;
                    }
                }
            }
            // Remove off-screen lasers
            obstacles = obstacles.filter(obs => obs.y < 650);
        }

        function draw() {
            // Clear screen
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Lab Background grid
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.1)';
            for(let i=0; i<400; i+=40) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 600); ctx.stroke(); }
            for(let i=0; i<600; i+=40) { ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(400, i); ctx.stroke(); }

            // Draw Metal Ball
            ctx.fillStyle = ball.color;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fill();
            // Shiny metallic effect
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(ball.x - 3, ball.y - 3, 3, 0, Math.PI * 2);
            ctx.fill();

            // Draw Lasers (with safe gap)
            ctx.fillStyle = '#ff003c';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#ff003c';
            for (let obs of obstacles) {
                // Left side of laser
                ctx.fillRect(0, obs.y, obs.gapX, obs.height);
                // Right side of laser
                ctx.fillRect(obs.gapX + obs.gapWidth, obs.y, 400 - (obs.gapX + obs.gapWidth), obs.height);
            }
            ctx.shadowBlur = 0; // Reset shadow so other things don't glow
            
            // Draw Progress text
            ctx.fillStyle = '#ffffff';
            ctx.font = '16px Orbitron';
            ctx.fillText(`Lasers Dodged: ${obstaclesPassed} / ${obstaclesToPass}`, 10, 580);
        }

        function loop() {
            if (!isPlaying) return;
            frame++;
            spawnObstacle();
            update();
            draw();
            requestAnimationFrame(loop);
        }

        // Initialize Menu on load
        buildMenu();
    </script>
</body>
</html>
