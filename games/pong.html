<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Pong</title>
    <style>
        body { margin: 0; background-color: #050505; color: #fff; font-family: 'Orbitron', sans-serif; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; flex-direction: column; }
        
        /* Menus */
        .menu-container { text-align: center; background: rgba(10, 10, 20, 0.9); padding: 40px; border: 2px solid #00ffff; border-radius: 15px; box-shadow: 0 0 20px #00ffff; z-index: 10; max-width: 600px; }
        h1 { font-size: 40px; color: #00ffff; text-shadow: 0 0 15px #00ffff; margin-top: 0; }
        
        /* Buttons */
        button { background: transparent; color: #00ffff; border: 2px solid #00ffff; padding: 15px 30px; font-size: 18px; font-weight: bold; cursor: pointer; border-radius: 8px; font-family: 'Orbitron', sans-serif; margin: 10px; transition: 0.3s; text-shadow: 0 0 5px #00ffff; box-shadow: 0 0 5px #00ffff inset; }
        button:hover { background: #00ffff; color: #000; box-shadow: 0 0 20px #00ffff; }
        button:disabled { border-color: #555; color: #555; box-shadow: none; text-shadow: none; cursor: not-allowed; }

        /* Top Bar */
        .top-bar { position: absolute; top: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; z-index: 20; pointer-events: none; }
        .top-bar button { pointer-events: auto; padding: 10px 20px; font-size: 14px; margin: 0; }
        .stats { font-size: 20px; color: #ffd700; text-shadow: 0 0 10px #ffd700; }

        /* Shop Grid */
        .shop-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 20px; }
        .shop-item { border: 2px solid #fff; padding: 15px; border-radius: 10px; text-align: center; }

        #gameCanvas { background: #050505; border: 2px solid #333; border-radius: 10px; display: none; box-shadow: 0 0 30px rgba(0, 255, 255, 0.2); cursor: none; }
        .hidden { display: none !important; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;900&display=swap" rel="stylesheet">
</head>
<body>

    <div class="top-bar">
        <button onclick="window.location.href='../index.html'">🔙 Hub</button>
        <div class="stats" id="coinDisplay">Coins: 0</div>
    </div>

    <!-- MAIN MENU -->
    <div id="mainMenu" class="menu-container">
        <h1>NEON PONG</h1>
        <p>Current Level: <span id="levelDisplay">1</span></p>
        <p>First to 5 points wins. Winning earns you Neon Coins!</p>
        <button onclick="startGame()">PLAY LEVEL</button>
        <button onclick="openShop()">ITEM SHOP</button>
    </div>

    <!-- SHOP MENU -->
    <div id="shopMenu" class="menu-container hidden">
        <h1 style="color: #ff00ff; text-shadow: 0 0 15px #ff00ff; border-color: #ff00ff;">SKIN SHOP</h1>
        <div class="shop-grid" id="shopGrid">
            <!-- Shop items generate here -->
        </div>
        <button onclick="closeShop()" style="border-color: #ff00ff; color: #ff00ff; box-shadow: 0 0 5px #ff00ff inset;">🔙 Back</button>
    </div>

    <!-- GAME CANVAS -->
    <canvas id="gameCanvas" width="800" height="500"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const mainMenu = document.getElementById('mainMenu');
        const shopMenu = document.getElementById('shopMenu');
        const coinDisplay = document.getElementById('coinDisplay');
        const levelDisplay = document.getElementById('levelDisplay');
        const shopGrid = document.getElementById('shopGrid');

        // SAVE DATA
        let coins = parseInt(localStorage.getItem('pong_coins')) || 0;
        let currentLevel = parseInt(localStorage.getItem('pong_level')) || 1;
        let unlockedSkins = JSON.parse(localStorage.getItem('pong_skins')) || [0];
        let equippedSkin = parseInt(localStorage.getItem('pong_equipped')) || 0;

        // SKIN DATA
        const skins = [
            { name: "Basic White", color: "#ffffff", cost: 0 },
            { name: "Neon Cyan", color: "#00ffff", cost: 50 },
            { name: "Hot Pink", color: "#ff00ff", cost: 100 },
            { name: "Toxic Green", color: "#00ff00", cost: 200 },
            { name: "Gold Core", color: "#ffd700", cost: 500 }
        ];

        // GAME VARIABLES
        let isPlaying = false;
        let trail = [];
        const winScore = 5;

        const player = { x: 20, y: 200, width: 10, height: 80, score: 0 };
        const bot = { x: 770, y: 200, width: 10, height: 80, score: 0, speed: 3 };
        const ball = { x: 400, y: 250, radius: 8, dx: 5, dy: 5, speed: 5 };

        // INITIALIZE
        function updateUI() {
            coinDisplay.innerText = `Coins: ${coins}`;
            levelDisplay.innerText = currentLevel;
        }
        updateUI();

        // CONTROLS (Mouse Movement)
        canvas.addEventListener('mousemove', (e) => {
            let rect = canvas.getBoundingClientRect();
            // Center the paddle on the mouse
            player.y = e.clientY - rect.top - (player.height / 2);
            // Keep paddle on screen
            if (player.y < 0) player.y = 0;
            if (player.y + player.height > canvas.height) player.y = canvas.height - player.height;
        });

        // --- SHOP LOGIC ---
        function openShop() {
            mainMenu.classList.add('hidden');
            shopMenu.classList.remove('hidden');
            buildShop();
        }

        function closeShop() {
            shopMenu.classList.add('hidden');
            mainMenu.classList.remove('hidden');
            updateUI();
        }

        function buildShop() {
            shopGrid.innerHTML = '';
            skins.forEach((skin, index) => {
                let div = document.createElement('div');
                div.className = 'shop-item';
                div.style.borderColor = skin.color;
                div.style.boxShadow = `0 0 10px ${skin.color} inset`;
                
                let title = document.createElement('h3');
                title.innerText = skin.name;
                title.style.color = skin.color;
                title.style.textShadow = `0 0 5px ${skin.color}`;
                
                let btn = document.createElement('button');
                btn.style.borderColor = skin.color;
                btn.style.color = skin.color;
                
                if (unlockedSkins.includes(index)) {
                    if (equippedSkin === index) {
                        btn.innerText = "EQUIPPED";
                        btn.disabled = true;
                    } else {
                        btn.innerText = "EQUIP";
                        btn.onclick = () => { equippedSkin = index; localStorage.setItem('pong_equipped', index); buildShop(); };
                    }
                } else {
                    btn.innerText = `BUY (${skin.cost})`;
                    if (coins < skin.cost) btn.disabled = true;
                    btn.onclick = () => {
                        coins -= skin.cost;
                        unlockedSkins.push(index);
                        localStorage.setItem('pong_coins', coins);
                        localStorage.setItem('pong_skins', JSON.stringify(unlockedSkins));
                        buildShop();
                        updateUI();
                    };
                }

                div.appendChild(title);
                div.appendChild(btn);
                shopGrid.appendChild(div);
            });
        }

        // --- GAME LOGIC ---
        function startGame() {
            mainMenu.classList.add('hidden');
            canvas.style.display = 'block';
            player.score = 0;
            bot.score = 0;
            bot.speed = 3 + (currentLevel * 0.5); // Bot gets faster every level
            resetBall();
            trail = [];
            isPlaying = true;
        }

        function resetBall() {
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            ball.speed = 5 + (currentLevel * 0.2); // Ball gets faster every level
            ball.dx = (Math.random() > 0.5 ? 1 : -1) * ball.speed;
            ball.dy = (Math.random() > 0.5 ? 1 : -1) * (ball.speed * 0.5);
            trail = [];
        }

        function endGame(playerWon) {
            isPlaying = false;
            canvas.style.display = 'none';
            mainMenu.classList.remove('hidden');
            
            if (playerWon) {
                let winnings = 50 + (currentLevel * 10);
                coins += winnings;
                currentLevel++;
                localStorage.setItem('pong_coins', coins);
                localStorage.setItem('pong_level', currentLevel);
                alert(`VICTORY! You earned ${winnings} Neon Coins! Proceeding to Level ${currentLevel}.`);
            } else {
                alert("DEFEAT! The bot beat you. Try again!");
            }
            updateUI();
        }

        function update() {
            // Move Ball
            ball.x += ball.dx;
            ball.y += ball.dy;

            // Save trail
            trail.push({ x: ball.x, y: ball.y });
            if (trail.length > 15) trail.shift();

            // Wall Collision (Top/Bottom)
            if (ball.y - ball.radius < 0 || ball.y + ball.radius > canvas.height) {
                ball.dy *= -1;
            }

            // Move Bot (Chases the ball)
            let botCenter = bot.y + bot.height / 2;
            if (botCenter < ball.y - 10) bot.y += bot.speed;
            else if (botCenter > ball.y + 10) bot.y -= bot.speed;
            
            // Keep bot on screen
            if (bot.y < 0) bot.y = 0;
            if (bot.y + bot.height > canvas.height) bot.y = canvas.height - bot.height;

            // Paddle Collision
            let hitPaddle = (paddle) => {
                let hitPoint = ball.y - (paddle.y + paddle.height / 2);
                hitPoint = hitPoint / (paddle.height / 2); // Value between -1 and 1
                let angle = hitPoint * (Math.PI / 4); // Max bounce angle 45 degrees
                
                let direction = (ball.x < canvas.width / 2) ? 1 : -1;
                ball.speed += 0.2; // Speed up slightly on every hit
                ball.dx = direction * ball.speed * Math.cos(angle);
                ball.dy = ball.speed * Math.sin(angle);
            };

            // Hit Player
            if (ball.x - ball.radius < player.x + player.width && ball.y > player.y && ball.y < player.y + player.height) {
                ball.x = player.x + player.width + ball.radius; // Prevent getting stuck inside paddle
                hitPaddle(player);
            }
            // Hit Bot
            if (ball.x + ball.radius > bot.x && ball.y > bot.y && ball.y < bot.y + bot.height) {
                ball.x = bot.x - ball.radius;
                hitPaddle(bot);
            }

            // Score Points
            if (ball.x < 0) { bot.score++; resetBall(); }
            if (ball.x > canvas.width) { player.score++; resetBall(); }

            // Check Win Condition
            if (player.score >= winScore) endGame(true);
            if (bot.score >= winScore) endGame(false);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            let activeColor = skins[equippedSkin].color;

            // Draw Net (Dashed line)
            ctx.fillStyle = "rgba(255, 255, 255, 0.2)";
            for (let i = 0; i < canvas.height; i += 30) {
                ctx.fillRect(canvas.width / 2 - 1, i, 2, 15);
            }

            // Draw Scores
            ctx.fillStyle = "rgba(255, 255, 255, 0.3)";
            ctx.font = "80px Orbitron";
            ctx.fillText(player.score, canvas.width / 4, 100);
            ctx.fillText(bot.score, 3 * canvas.width / 4 - 40, 100);

            // Set Glow effect for paddles and ball
            ctx.shadowBlur = 15;
            ctx.shadowColor = activeColor;

            // Draw Player Paddle (Uses equipped skin color)
            ctx.fillStyle = activeColor;
            ctx.fillRect(player.x, player.y, player.width, player.height);

            // Draw Bot Paddle (Always evil red)
            ctx.shadowColor = "#ff0000";
            ctx.fillStyle = "#ff0000";
            ctx.fillRect(bot.x, bot.y, bot.width, bot.height);

            // Draw Ball Trail
            ctx.shadowBlur = 0; // Turn off main shadow for the trail
            for (let i = 0; i < trail.length; i++) {
                let alpha = i / trail.length; // Fades out the tail
                ctx.fillStyle = `rgba(${hexToRgb(activeColor)}, ${alpha})`;
                ctx.beginPath();
                ctx.arc(trail[i].x, trail[i].y, ball.radius * (i / trail.length), 0, Math.PI * 2);
                ctx.fill();
            }

            // Draw Ball (Uses equipped skin color)
            ctx.shadowBlur = 15;
            ctx.shadowColor = activeColor;
            ctx.fillStyle = activeColor;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0; 
        }

        // Helper function to convert Hex color to RGB for the trail transparency
        function hexToRgb(hex) {
            let r = parseInt(hex.slice(1, 3), 16);
            let g = parseInt(hex.slice(3, 5), 16);
            let b = parseInt(hex.slice(5, 7), 16);
            return `${r}, ${g}, ${b}`;
        }

        // --- THE MASTER LOOP ---
        function masterLoop() {
            requestAnimationFrame(masterLoop);
            if (!isPlaying) return;
            update();
            draw();
        }

        masterLoop(); // Start engine!
    </script>
</body>
</html>
